name: Citas DIAN

on:
  schedule:
    - cron: "*/10 * * * *"   # arranca un turno; dentro del turno se consulta cada 15 segundos
  workflow_dispatch:          # a mano (prueba) o encadenado por el propio bot (turno)
    inputs:
      prueba:
        description: "Prueba: una sola consulta y aviso al celular"
        type: boolean
        default: true

concurrency:
  group: citas-dian
  cancel-in-progress: false   # un turno a la vez; el siguiente espera a que termine el actual

permissions:
  contents: write             # para poder guardar el registro de consultas
  actions: write              # para que cada turno deje programado el siguiente

jobs:
  consultar:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - name: Instalar navegador
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Consultar y registrar
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba }}
          GH_TOKEN: ${{ github.token }}
          CADA_SEG: "60"      # cada cuánto se guarda el registro (una tanda de consultas por minuto)
          INTERVALO_SEG: "15" # cada cuánto se consulta la página dentro de la tanda
          TANDA_SEG: "60"     # cuánto dura cada tanda de consultas
          CIUDADES: "todas"   # avisa de todas las ciudades (o solo algunas: "Bogotá,Medellín")
          TURNO_SEG: "18000"   # cuánto dura cada turno (18000 segundos = 5 horas)
        run: |
          REMOTO="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          guardar_registro() {
            local AHORA_CO AHORA_UTC DIA LINEA ARCHIVO
            AHORA_CO=$(TZ=America/Bogota date '+%Y-%m-%d %H:%M:%S')
            AHORA_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
            DIA=$(TZ=America/Bogota date '+%Y-%m-%d')
            if [ ! -s linea.csv ]; then
              echo "${AHORA_CO};error;El bot no alcanzó a consultar la página;${AHORA_UTC};" > linea.csv
            fi
            LINEA=$(tail -n 1 linea.csv)
            rm -rf /tmp/datos
            if git ls-remote --exit-code --heads "$REMOTO" datos >/dev/null 2>&1; then
              git clone --quiet --depth 1 --branch datos "$REMOTO" /tmp/datos || return 1
            else
              git init --quiet --initial-branch=datos /tmp/datos || return 1
              git -C /tmp/datos remote add origin "$REMOTO" || return 1
            fi
            ARCHIVO="/tmp/datos/registro-${DIA}.csv"
            [ -f "$ARCHIVO" ] || echo "fecha_hora_colombia;estado;detalle;fecha_utc;captura" > "$ARCHIVO"
            cat linea.csv >> "$ARCHIVO"
            if [ -n "$(ls -A capturas_tanda 2>/dev/null)" ]; then
              mkdir -p /tmp/datos/capturas
              cp capturas_tanda/* /tmp/datos/capturas/
            fi
            git -C /tmp/datos add -A || return 1
            git -C /tmp/datos -c user.name="bot-citas-dian" -c user.email="bot-citas-dian@users.noreply.github.com" \
              commit --quiet -m "Consulta ${AHORA_CO}: $(echo "$LINEA" | cut -d';' -f2)" || return 1
            git -C /tmp/datos push --quiet origin datos || return 1
          }

          FIN=$(( $(date +%s) + TURNO_SEG ))
          TOTAL=0
          FALLAS=0
          while true; do
            INICIO=$(date +%s)
            rm -rf linea.csv resultado.png capturas_tanda
            if ! timeout 180 node monitor.js; then FALLAS=$((FALLAS + 1)); fi
            TOTAL=$((TOTAL + 1))
            guardar_registro || { sleep 5; guardar_registro; } || echo "No se pudo guardar el registro de esta consulta."
            if [ "$MANUAL" = "true" ]; then break; fi
            SIGUIENTE=$(( INICIO + CADA_SEG ))
            if [ "$SIGUIENTE" -ge "$FIN" ]; then break; fi
            AHORA=$(date +%s)
            if [ "$SIGUIENTE" -gt "$AHORA" ]; then sleep $(( SIGUIENTE - AHORA )); fi
          done
          echo "Consultas en este turno: ${TOTAL}. Fallidas: ${FALLAS}."
          if [ "$MANUAL" != "true" ]; then
            gh workflow run "Citas DIAN" -R "$GITHUB_REPOSITORY" --ref main -f prueba=false \
              && echo "Siguiente turno programado." \
              || echo "No se pudo programar el siguiente turno; lo retomará la programación automática."
          fi
          if [ "$FALLAS" -eq "$TOTAL" ]; then exit 1; fi

      - name: Guardar capturas
        if: ${{ failure() || (github.event_name == 'workflow_dispatch' && inputs.prueba) }}
        uses: actions/upload-artifact@v7
        with:
          name: capturas
          path: |
            *.png
            marco-*.html
            *.txt
          retention-days: 3
          if-no-files-found: ignore
